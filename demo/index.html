  <body>
    <main id="demo">
      <noscript>
        <h1>Honeydew</h1>
        <p>
          An FFGL source that's a thin layer of reagents in a dish on a
          lightbox, and an effect where your clip is the lightbox. There are
          eight reactions, each from its published mechanism: the
          Belousov–Zhabotinsky reaction's target waves (and spirals, with
          Excitability turned up), the Briggs–Rauscher reaction's
          colourless–amber–blue-black cycle, the iodine clock's snap (dosed so
          it lands on the bar), CDIMA Turing spots and stripes, the traffic
          light, the blue bottle, the vanishing valentine and the chemical
          chameleon. There's no palette anywhere: every pixel is light that's
          been through each species' absorption spectrum.
        </p>
        <p>
          This demo runs the plugin's own C++, compiled to WebAssembly, and its
          shaders in your browser, so it needs JavaScript and WebGL2. The plugin
          itself, its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/honeydew">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/honeydew/">Project page and downloads</a></li>
